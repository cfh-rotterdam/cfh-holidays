<style>
:root{
  --bg:#0A0A0C;--s1:#141417;--s2:#1B1B1F;--s3:#232328;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --t1:#FAFAFA;--t2:#A1A1AA;--t3:#52525B;
  --lime1:#A3E635;--lime2:#65A30D;--cyan1:#22D3EE;--cyan2:#0891B2;--amb1:#FBBF24;--amb2:#D97706;
  --err:#F87171;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--t1);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1400px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan1);outline-offset:2px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{height:44px;width:auto;color:var(--t1);flex:none}
.brand h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--t2);font-size:13px}
.top-r{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;color:var(--t2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--lime1);box-shadow:0 0 0 3px rgba(163,230,53,.15)}
.status.warn i{background:var(--amb1);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.status.bad i{background:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
.status.shared i{background:var(--cyan1);box-shadow:0 0 0 3px rgba(34,211,238,.15)}

/* tabs */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--s1);border:1px solid var(--line);margin-bottom:24px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 16px;border-radius:999px;color:var(--t2);cursor:pointer;white-space:nowrap;font-size:14px;transition:background .2s var(--ease),color .2s var(--ease)}
.tab:hover{color:var(--t1)}
.tab.on{background:var(--s3);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.pad{padding:24px}
.stack>*+*{margin-top:16px}
.h2{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600}
.muted{color:var(--t2);font-size:14px}
.divider{height:1px;background:var(--line);margin:24px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat{padding:24px;display:flex;align-items:center;gap:20px;min-width:0}
.stat .body{min-width:0}
.num{font-size:56px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:8px 0 6px;-webkit-background-clip:text;background-clip:text;color:transparent}
.g-lime{background-image:linear-gradient(135deg,var(--lime1),var(--lime2))}
.g-amb{background-image:linear-gradient(135deg,var(--amb1),var(--amb2))}
.g-cyan{background-image:linear-gradient(135deg,var(--cyan1),var(--cyan2))}
.det{color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{flex:none}
.ring.anim .arc{animation:ringIn .9s var(--ease) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input,.select{height:40px;padding:0 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--t1);min-width:0}
.select{padding-right:8px}
.input:focus,.select:focus{border-color:rgba(34,211,238,.6);outline:none;box-shadow:0 0 0 3px rgba(34,211,238,.15)}
input[type=color].input{width:52px;padding:4px;cursor:pointer}
.form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.form .field{flex:1 1 160px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:background .2s var(--ease),border-color .2s var(--ease),opacity .2s var(--ease)}
.btn-primary{background:var(--t1);color:#0A0A0C}
.btn-primary:hover{background:#E4E4E7}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--t1)}
.btn-ghost:hover{background:var(--s2)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;border:1px solid transparent;background:none;color:var(--t2);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.iconbtn:hover{background:var(--s2);color:var(--t1)}
.iconbtn.danger:hover{color:var(--err)}
.link{background:none;border:0;padding:0;color:var(--t2);cursor:pointer;font-size:13px}
.link:hover{color:var(--t1)}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--lime1);font-size:14px;margin-top:16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;padding:0 10px;border-radius:999px;background:var(--s3);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--t1);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.chip .x{display:inline-flex;background:none;border:0;padding:0;margin-right:-4px;color:var(--t3);cursor:pointer}
.chip .x:hover{color:var(--t1)}
.chip .x .ic{width:14px;height:14px}
.loc{font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:6px}
.loc.cen{color:#FDA4AF;background:rgba(244,63,94,.14)}
.loc.air{color:var(--t2);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line2)}

/* covers */
.cov-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.covers{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.cover{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.cover.cxl{background:transparent;border-style:dashed}
.cover.cxl .chip{opacity:.55;text-decoration:line-through}
.pill-w{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cover.bad{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.06)}
.cover .when{font-size:13px;font-weight:600;margin-bottom:6px}
.cover .select{height:34px;font-size:13px;border-radius:10px;max-width:150px}
.warn-note{display:flex;align-items:center;gap:4px;color:var(--err);font-size:11px;font-weight:600;margin-top:4px;justify-content:flex-end}
.warn-note .ic{width:12px;height:12px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px}

/* holiday rows */
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1.2fr) auto;align-items:center;gap:16px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.hrow.past{opacity:.5}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s3);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--t2);flex:none;letter-spacing:.02em}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rng{color:var(--t2);font-size:13px;font-variant-numeric:tabular-nums}
.cnt{color:var(--t2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt b{color:var(--t1);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill.good{color:var(--lime1);background:rgba(163,230,53,.1)}
.pill.open{color:var(--amb1);background:rgba(251,191,36,.12)}
.pill.none{color:var(--t2);background:rgba(255,255,255,.05)}
.acts{display:flex;gap:2px}

/* calendar */
.cal-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.month{display:flex;align-items:center;gap:8px}
.month h2{min-width:170px;text-align:center}
.legend{display:flex;gap:16px;color:var(--t2);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px}
.scroll{overflow-x:auto;margin:0 -24px;padding:0 24px}
table.cal{border-collapse:separate;border-spacing:3px;font-size:12px;font-variant-numeric:tabular-nums}
table.cal th{font-weight:500;color:var(--t3);padding:4px 0 8px;text-align:center;min-width:28px}
table.cal th .d{display:block;color:var(--t2);font-size:13px;font-weight:600}
table.cal th.today .d{color:var(--cyan1)}
table.cal th.today{box-shadow:inset 0 -2px 0 var(--cyan1)}
table.cal td{width:28px;height:30px;text-align:center;border-radius:8px;background:rgba(255,255,255,.025);font-weight:700;font-size:11px}
table.cal td.we{background:rgba(255,255,255,.055)}
table.cal td.f{background:linear-gradient(135deg,var(--amb1),var(--amb2));color:#1a1204;cursor:help}
table.cal td.s{background:linear-gradient(135deg,var(--lime1),var(--lime2));color:#111a04;cursor:help}
table.cal .who-c{position:sticky;left:0;z-index:1;background:var(--s1);text-align:left;padding-right:12px;font-weight:500;font-size:13px;white-space:nowrap;min-width:130px;color:var(--t1)}

/* team */
.coaches{display:flex;flex-direction:column;gap:16px}
.coach-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.coach-h .h2{font-size:18px}
.coach-h .sub{color:var(--t2);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{padding:16px 12px;min-height:120px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.day:first-child{border-left:0}
.day .lbl{margin-bottom:4px}
.addform{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:4px}
.addform .select{height:34px;font-size:13px;border-radius:10px;width:100%}
.addform .row{display:flex;gap:6px}
.add-cls{display:inline-flex;align-items:center;gap:4px;background:none;border:1px dashed var(--line2);border-radius:999px;height:28px;padding:0 10px;color:var(--t3);cursor:pointer;font-size:12px}
.add-cls:hover{color:var(--t1);border-color:var(--t3)}
.add-cls .ic{width:12px;height:12px}

/* settings */
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* empty + skeleton */
.empty{padding:48px 24px;text-align:center;color:var(--t2)}
.empty .h2{color:var(--t1);margin-bottom:8px}
.empty .btn{margin-top:16px}
.sk{border-radius:24px;background:var(--s1);border:1px solid var(--line);height:140px;animation:pulse 1.4s var(--ease) infinite}
@keyframes pulse{50%{opacity:.55}}

@media (max-width:900px){
  .stats{grid-template-columns:1fr}
  .hrow{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .hrow .cnt{grid-column:2;grid-row:1;text-align:right}
  .hrow .pill-w{grid-column:1}
  .hrow .acts{grid-column:2;justify-content:flex-end}
  .week{grid-template-columns:1fr}
  .day{border-left:0;border-top:1px solid var(--line);min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 20px}
  .day:first-child{border-top:0}
  .day .lbl{width:44px;margin:0}
  .addform{flex-basis:100%}
}
@media (max-width:560px){
  #app{padding-left:16px;padding-right:16px}
  .top{align-items:flex-start}
  .brand h1{font-size:24px}
  .logo{height:36px}
  .status span{display:none}
  .pad,.stat{padding:20px}
  .num{font-size:48px}
  .scroll{margin:0 -20px;padding:0 20px}
  .form .field{flex-basis:100%}
  .form .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const BUILTIN=[{name:"WOD",color:"#000000"},{name:"Strength Class",color:"#8B1E3F"},{name:"Engine",color:"#0E6BA8"},{name:"HYROX",color:"#B7791F"},{name:"Oly",color:"#6B21A8"},{name:"Bootcamp",color:"#0F766E"},{name:"Kids",color:"#DB2777"},{name:"Teens",color:"#4338CA"},{name:"Silver",color:"#C0C0C0"},{name:"Core30",color:"#0891B2",dur:30},{name:"Open Gym",color:"#5B6770"}];
const TIMES=(()=>{const o=[];for(let h=6;h<=22;h++)for(let q=0;q<4;q++){if(h===22&&q>0)break;o.push(pad2(h)+":"+pad2(q*15))}return o})();
const LOCS=["Central","Airport"];
function pad2(n){return String(n).padStart(2,"0")}
const allTypes=()=>BUILTIN.concat(st.customTypes||[]);
const typeOf=n=>allTypes().find(t=>t.name===n);
const tcol=n=>{const t=typeOf(n);return(t&&t.color)||"#5B6770"};
const tdur=n=>{const t=typeOf(n);return(t&&t.dur)||0};
const tlabel=(time,n)=>time+" "+n+(tdur(n)?" "+tdur(n)+"'":"");
const txtOn=c=>{const h=String(c).replace("#","");if(h.length<6)return"#fff";const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return(.299*r+.587*g+.114*b)>150?"#16181D":"#fff"};
const chipStyle=n=>{const c=tcol(n);return"background:"+c+";color:"+txtOn(c)};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad=n=>String(n).padStart(2,"0");
const toKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dayName=d=>DAYS[(d.getDay()+6)%7];
const fmtShort=k=>{const d=fromKey(k);return dayName(d)+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)};
const eachDay=(f,t)=>{const o=[];let d=fromKey(f),e=fromKey(t);while(d<=e){o.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return o};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const now=new Date();
const st={tab:"plan",coaches:[],holidays:[],loading:true,

// ---------- CLOUD SETUP (optional, makes the board a real shared webpage) ----------
// Paste your Firebase Realtime Database URL between the quotes, e.g.:
// const CLOUD_DB_URL="https://cfh-holidays-default-rtdb.europe-west1.firebasedatabase.app";
const CLOUD_DB_URL="https://cfh-holiday-planning-default-rtdb.europe-west1.firebasedatabase.app";

// ---------- storage adapter: cloud -> shared (Claude artifact) -> localStorage -> memory ----------
const store=(function(){
  if(CLOUD_DB_URL){
    const base=CLOUD_DB_URL.replace(/\/+$/,"");
    const u=k=>base+"/board/"+encodeURIComponent(k)+".json";
    return{mode:"cloud",
      get:async k=>{const r=await fetch(u(k));if(!r.ok)throw new Error("http "+r.status);const v=await r.json();if(v===null)throw new Error("not found");return{key:k,value:v}},
      set:async(k,v)=>{const r=await fetch(u(k),{method:"PUT",body:JSON.stringify(v)});if(!r.ok)throw new Error("http "+r.status);return{key:k,value:v}},
      del:async k=>{const r=await fetch(u(k),{method:"DELETE"});if(!r.ok)throw new Error("http "+r.status);return{key:k,deleted:true}},
      list:async p=>{const r=await fetch(base+"/board.json?shallow=true");if(!r.ok)throw new Error("http "+r.status);const o=await r.json()||{};return{keys:Object.keys(o).map(decodeURIComponent).filter(k=>k.startsWith(p)).map(k=>({key:k}))}}};
  }
  try{
    if(window.storage&&typeof window.storage.get==="function"){
      return{mode:"shared",
        get:k=>window.storage.get(k,true),
        set:(k,v)=>window.storage.set(k,v,true),
        del:k=>window.storage.delete(k,true),
        list:p=>window.storage.list(p,true)};
    }
  }catch(e){}
  try{
    const ls=window.localStorage;ls.setItem("__cfh_t","1");ls.removeItem("__cfh_t");
    const P="cfhX:";
    return{mode:"local",
      get:async k=>{const v=ls.getItem(P+k);if(v===null)throw new Error("not found");return{key:k,value:v}},
      set:async(k,v)=>{ls.setItem(P+k,v);return{key:k,value:v}},
      del:async k=>{ls.removeItem(P+k);return{key:k,deleted:true}},
      list:async p=>{const keys=[];for(let i=0;i<ls.length;i++){const k=ls.key(i);if(k&&k.startsWith(P+p))keys.push({key:k.slice(P.length)})}return{keys}}};
  }catch(e){}
  const mem={};
  return{mode:"memory",
    get:async k=>{if(!(k in mem))throw new Error("not found");return{key:k,value:mem[k]}},
    set:async(k,v)=>{mem[k]=v;return{key:k,value:v}},
    del:async k=>{delete mem[k];return{key:k,deleted:true}},
    list:async p=>({keys:Object.keys(mem).filter(k=>k.startsWith(p)).map(k=>({key:k}))})};
})();

async function loadAll(){
  st.loading=true;render();
  let coaches=[],holidays=[],ctypes=[];
  try{const c=await store.get("cfh-coaches");if(c&&c.value)coaches=JSON.parse(c.value)}catch(e){}
  try{const t=await store.get("cfh-types");if(t&&t.value)ctypes=JSON.parse(t.value)}catch(e){}
  try{
    const l=await store.list("cfh-hol:");
    const keys=(l&&l.keys)||[];
    const rs=await Promise.all(keys.map(async k=>{try{const r=await store.get(k.key||k);return r?JSON.parse(r.value):null}catch(e){return null}}));
    holidays=rs.filter(Boolean);
  }catch(e){}
  const cx=coaches.filter(c=>String(c.name||"").trim().toUpperCase()==="CANCELLED").map(c=>c.id);
  if(cx.length)for(const h of holidays){let ch=false;(h.covers||[]).forEach(c=>{if(cx.includes(c.subId)){c.subId=CANCEL;ch=true}});if(ch)saveHol(h)}
  st.coaches=coaches;st.holidays=holidays;st.customTypes=ctypes;st.loading=false;render();
}
async function saveCoaches(){try{await store.set("cfh-coaches",JSON.stringify(st.coaches))}catch(e){console.error(e)}}
async function saveHol(h){try{await store.set("cfh-hol:"+h.id,JSON.stringify(h))}catch(e){console.error(e)}}
async function delHol(id){try{await store.del("cfh-hol:"+id)}catch(e){console.error(e)}}

const byId=id=>st.coaches.find(c=>c.id===id);
const onHoliday=(cid,dk)=>st.holidays.some(h=>h.coachId===cid&&h.from<=dk&&dk<=h.to);

A.tab=t=>{st.tab=t;render()};
A.refresh=()=>loadAll();
A.addName=v=>{st.addName=v};
A.addCoach=()=>{const n=st.addName.trim();if(!n)return;
  st.coaches.push({id:uid(),name:n,schedule:Object.fromEntries(DAYS.map(d=>[d,[]]))});
  st.addName="";saveCoaches();render()};
A.rmCoach=id=>{if(!confirm("Remove this coach and their schedule?"))return;
  st.coaches=st.coaches.filter(c=>c.id!==id);saveCoaches();render()};
A.openAdd=(cid,day)=>{st.editingDay=cid+"|"+day;render()};
A.closeAdd=()=>{st.editingDay=null;render()};

A.setType=v=>{st.editType=v};
A.setLoc=v=>{st.editLoc=v};
A.addClass=(cid,day)=>{const c=byId(cid);if(!c)return;
  c.schedule[day]=[...c.schedule[day],{time:st.editTime,type:st.editType,loc:st.editLoc}].sort((a,b)=>a.time.localeCompare(b.time));
  st.editingDay=null;saveCoaches();render()};
A.rmClass=(cid,day,i)=>{const c=byId(cid);if(!c)return;
  c.schedule[day]=c.schedule[day].filter((_,j)=>j!==i);saveCoaches();render()};
A.planCoach=v=>{st.planCoach=v;st.covers=null;render()};
A.planFrom=v=>{st.planFrom=v;st.covers=null;render()};
A.planTo=v=>{st.planTo=v;st.covers=null;render()};
A.compute=()=>{const c=byId(st.planCoach);
  if(!c||!st.planFrom||!st.planTo||st.planTo<st.planFrom)return;
  const list=[];
  for(const d of eachDay(st.planFrom,st.planTo)){const k=toKey(d);
    for(const cl of c.schedule[dayName(d)]||[])list.push({date:k,time:cl.time,type:cl.type,loc:cl.loc||"",subId:""})}
  st.covers=list;st.saved=false;render()};
A.assignAll=v=>{if(!v||!st.covers)return;st.covers=st.covers.map(c=>({...c,subId:v}));render()};
A.assignOne=(i,v)=>{st.covers[i].subId=v;render()};
A.saveHoliday=async()=>{const h={id:st.editingId||uid(),coachId:st.planCoach,from:st.planFrom,to:st.planTo,covers:st.covers||[]};
  await saveHol(h);st.holidays=st.holidays.filter(x=>x.id!==h.id).concat([h]);
  st.covers=null;st.planFrom="";st.planTo="";st.editingId=null;st.saved=true;render()};
A.editHoliday=id=>{const h=st.holidays.find(x=>x.id===id);if(!h)return;
  st.editingId=h.id;st.planCoach=h.coachId;st.planFrom=h.from;st.planTo=h.to;
  st.covers=(h.covers||[]).map(c=>({...c}));st.saved=false;st.tab="plan";render()};
A.cancelEdit=()=>{st.editingId=null;st.covers=null;st.planFrom="";st.planTo="";render()};
A.deleteHoliday=async id=>{if(!confirm("Delete this holiday?"))return;
  await delHol(id);st.holidays=st.holidays.filter(h=>h.id!==id);render()};
A.ntName=v=>{st.ntName=v};
A.ntColor=v=>{st.ntColor=v};
A.ntDur=v=>{st.ntDur=v};
A.addType=async()=>{const n=st.ntName.trim();if(!n)return;
  if(allTypes().some(t=>t.name.toLowerCase()===n.toLowerCase())){alert("A class type with this name already exists.");return}
  const t={name:n,color:st.ntColor};const d=parseInt(st.ntDur,10);if(d>0)t.dur=d;
  st.customTypes=(st.customTypes||[]).concat([t]);st.ntName="";st.ntDur="";
  try{await store.set("cfh-types",JSON.stringify(st.customTypes))}catch(e){console.error(e)}
  render()};
A.rmType=async n=>{if(!confirm("Remove class type "+n+"? Classes already scheduled keep the name but lose the custom colour."))return;
  st.customTypes=(st.customTypes||[]).filter(t=>t.name!==n);
  try{await store.set("cfh-types",JSON.stringify(st.customTypes))}catch(e){console.error(e)}
  render()};
A.calMove=d=>{let m=st.calM+d,y=st.calY;if(m<0){m=11;y--}if(m>11){m=0;y++}st.calM=m;st.calY=y;render()};

// ---------- stats ----------
function stats(){
  const tk=toKey(new Date());
  const up=st.holidays.filter(h=>h.to>=tk);
  const off=st.holidays.filter(h=>h.from<=tk&&tk<=h.to).map(h=>(byId(h.coachId)||{}).name).filter(Boolean);
  let tot=0,cov=0,cxl=0;
  up.forEach(h=>(h.covers||[]).forEach(c=>{if(c.date>=tk){tot++;if(c.subId===CANCEL)cxl++;else if(c.subId)cov++}}));
  const next=up.filter(h=>h.from>tk).sort((a,b)=>a.from.localeCompare(b.from))[0];
  return {tk,up,off,tot,cov,cxl,next};
}
function ring(pct){
  const r=34,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,pct)));
  const svg='<svg class="ring'+(ringAnim?' anim':'')+'" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">'
    +'<defs><linearGradient id="gLime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#65A30D"/></linearGradient></defs>'
    +'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>'
    +'<circle class="arc" cx="42" cy="42" r="'+r+'" fill="none" stroke="url(#gLime)" stroke-width="8" stroke-linecap="round" '
    +'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+o.toFixed(2)+'" style="--c:'+c.toFixed(2)+'" transform="rotate(-90 42 42)"/></svg>';
  ringAnim=false;
  return svg;
}
function vStats(){
  const s=stats();
  const pct=s.tot?(s.cov+s.cxl)/s.tot:1;
  const open=s.tot-s.cov-s.cxl;
  const nextTxt=s.next?'Next: '+esc((byId(s.next.coachId)||{}).name||"?")+', '+fmtShort(s.next.from):'Nothing else booked';
  return '<section class="stats">'
    +'<div class="card stat">'+ring(pct)+'<div class="body"><div class="lbl">Coverage</div>'
      +'<div class="num g-lime">'+Math.round(pct*100)+'%</div>'
      +'<div class="det">'+(s.tot?(s.cov+' of '+s.tot+' upcoming classes covered'+(s.cxl?', '+s.cxl+' cancelled':'')+(open?', '+open+' open':'')):'No upcoming classes to cover')+'</div></div></div>'
    +'<div class="card stat"><div class="body"><div class="lbl">Off today</div>'
      +'<div class="num g-amb">'+s.off.length+'</div>'
      +'<div class="det">'+(s.off.length?esc(s.off.join(", ")):'Whole team is in')+'</div></div></div>'
    +'<div class="card stat"><div class="body"><div class="lbl">Booked holidays</div>'
      +'<div class="num g-cyan">'+s.up.length+'</div>'
      +'<div class="det">'+nextTxt+'</div></div></div>'
    +'</section>';
}

// ---------- views ----------
function emptyTeam(msg){
  return '<div class="card empty"><h2 class="h2">No coaches yet</h2><p>'+msg+'</p>'
    +'<button class="btn btn-primary" onclick="_cfh.tab(\'team\')">'+ic('plus')+'Add the team</button></div>';
}

function vPlan(){
  if(!st.coaches.length)return emptyTeam('Add each coach and their weekly classes first. The board then works out which classes need cover.');
  const others=st.coaches.filter(c=>c.id!==st.planCoach);
  const tk=toKey(new Date());
  let h=vStats();
  h+='<section class="card pad">'
    +'<div class="sec-h"><h2 class="h2">'+(st.editingId?'Edit holiday':'Plan a holiday')+'</h2></div>'
    +'<div class="form">'
    +'<label class="field"><span class="lbl">Coach</span><select class="select" onchange="_cfh.planCoach(this.value)"><option value="">Select coach</option>'
    +st.coaches.map(c=>'<option value="'+c.id+'"'+(c.id===st.planCoach?' selected':'')+'>'+esc(c.name)+'</option>').join("")+'</select></label>'
    +'<label class="field"><span class="lbl">From</span><input class="input" type="date" value="'+st.planFrom+'" onchange="_cfh.planFrom(this.value)"></label>'
    +'<label class="field"><span class="lbl">To</span><input class="input" type="date" value="'+st.planTo+'" onchange="_cfh.planTo(this.value)"></label>'
    +'<button class="btn btn-primary" onclick="_cfh.compute()">Show classes to cover</button>'
    +'</div>'
    +(st.saved?'<div class="ok">'+ic('check')+'Holiday saved</div>':'');
  if(st.covers){
    const saveLbl=st.editingId?'Update holiday':'Save holiday';
    const cancel=st.editingId?'<button class="btn btn-ghost" onclick="_cfh.cancelEdit()">Cancel</button>':'';
    h+='<div class="divider"></div>';
    if(!st.covers.length){
      h+='<p class="muted" style="margin:0">No classes in this period, so there is nothing to cover.</p>'
        +'<div class="foot"><button class="btn btn-primary" onclick="_cfh.saveHoliday()">'+saveLbl+'</button>'+cancel+'</div>';
    }else{
      h+='<div class="cov-head"><div><b>'+st.covers.length+' classes</b> <span class="muted">need cover</span></div>'
        +'<label class="field" style="flex-direction:row;align-items:center;gap:10px"><span class="muted">Assign all to</span>'
        +'<select class="select" onchange="_cfh.assignAll(this.value)"><option value="">Choose coach</option>'
        +others.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'<option value="'+CANCEL+'">All cancelled</option></select></label></div>'
        +'<div class="covers">';
      st.covers.forEach((cv,i)=>{
        const busy=cv.subId&&onHoliday(cv.subId,cv.date);
        h+='<div class="cover'+(busy?' bad':'')+(cv.subId===CANCEL?' cxl':'')+'"><div style="min-width:0"><div class="when">'+fmtShort(cv.date)+'</div>'+chip(cv.time,cv.type,cv.loc)+'</div>'
          +'<div><select class="select" aria-label="Cover for '+esc(fmtShort(cv.date)+' '+cv.time)+'" onchange="_cfh.assignOne('+i+',this.value)">'
          +'<option value="">Needs cover</option>'
          +others.map(c=>'<option value="'+c.id+'"'+(c.id===cv.subId?' selected':'')+'>'+esc(c.name)+'</option>').join("")
          +'<option value="'+CANCEL+'"'+(cv.subId===CANCEL?' selected':'')+'>Class cancelled</option>'
          +'</select>'+(busy?'<div class="warn-note">'+ic('alert')+'On holiday that day</div>':'')+'</div></div>';
      });
      h+='</div><div class="foot"><button class="btn btn-primary" onclick="_cfh.saveHoliday()">'+saveLbl+'</button>'+cancel
        +'<span class="muted" style="font-size:13px">Classes left on "Needs cover" can be assigned later with Edit.</span></div>';
    }
  }
  h+='</section>';

  const list=st.holidays.slice().sort((a,b)=>{const pa=a.to<tk,pb=b.to<tk;return pa!==pb?(pa?1:-1):a.from.localeCompare(b.from)});
  h+='<section class="card pad" style="margin-top:16px"><div class="sec-h"><h2 class="h2">Booked holidays</h2><span class="muted">'+list.length+' total</span></div>';
  if(!list.length)h+='<p class="muted" style="margin:0">Nothing booked yet. Pick a coach and dates above to plan the first one.</p>';
  else{
    h+='<div class="hlist">';
    for(const hh of list){
      const cs=hh.covers||[];
      const open=cs.filter(c=>!c.subId).length;
      const subs=[...new Set(cs.map(c=>c.subId).filter(Boolean))].map(id=>{const c=byId(id);return c?c.name:null}).filter(Boolean);
      const nm=(byId(hh.coachId)||{}).name||"?";
      const nc=cs.filter(c=>c.subId===CANCEL).length;
      let pill='';
      if(open)pill+='<span class="pill open">'+open+' still open</span>';
      else if(subs.length)pill+='<span class="pill good" title="Covered by '+esc(subs.join(", "))+'">Covered by '+esc(subs.join(", "))+'</span>';
      if(nc)pill+='<span class="pill none">'+nc+' cancelled</span>';
      if(!pill)pill='<span class="pill none">No classes</span>';
      h+='<div class="hrow'+(hh.to<tk?' past':'')+'">'
        +'<div class="who"><span class="avatar">'+esc(initials(nm))+'</span><div style="min-width:0"><div class="nm">'+esc(nm)+'</div>'
        +'<div class="rng">'+fmtShort(hh.from)+' &rarr; '+fmtShort(hh.to)+'</div></div></div>'
        +'<div class="cnt"><b>'+cs.length+'</b> classes</div>'
        +'<div class="pill-w">'+pill+'</div>'
        +'<div class="acts"><button class="iconbtn" aria-label="Edit holiday" title="Edit" onclick="_cfh.editHoliday(\''+hh.id+'\')">'+ic('edit')+'</button>'
        +'<button class="iconbtn danger" aria-label="Delete holiday" title="Delete" onclick="_cfh.deleteHoliday(\''+hh.id+'\')">'+ic('trash')+'</button></div>'
        +'</div>';
    }
    h+='</div>';
  }
  return h+'</section>';
}

function vCal(){
  if(!st.coaches.length)return emptyTeam('The calendar fills itself in once the team is set up.');
  const tk=toKey(new Date());
  const nd=new Date(st.calY,st.calM+1,0).getDate();
  const days=Array.from({length:nd},(_,i)=>new Date(st.calY,st.calM,i+1));
  const cell=(cid,dk)=>{
    for(const h of st.holidays)if(h.coachId===cid&&h.from<=dk&&dk<=h.to)return{m:"F",t:"On holiday"};
    for(const h of st.holidays){
      const mine=(h.covers||[]).filter(c=>c.subId===cid&&c.date===dk);
      if(mine.length){const o=byId(h.coachId);return{m:"S",t:mine.map(c=>c.time+" "+c.type+(c.loc?" at "+c.loc:"")+" for "+(o?o.name:"?")).join(" / ")}}
    }
    return null;
  };
  let h='<section class="card pad"><div class="cal-h"><div class="month">'
    +'<button class="iconbtn" aria-label="Previous month" onclick="_cfh.calMove(-1)">'+ic('left')+'</button>'
    +'<h2 class="h2">'+MONTHS[st.calM]+' '+st.calY+'</h2>'
    +'<button class="iconbtn" aria-label="Next month" onclick="_cfh.calMove(1)">'+ic('right')+'</button></div>'
    +'<div class="legend"><span><i class="sw" style="background:linear-gradient(135deg,var(--amb1),var(--amb2))"></i>On holiday</span>'
    +'<span><i class="sw" style="background:linear-gradient(135deg,var(--lime1),var(--lime2))"></i>Covering</span></div></div>'
    +'<div class="scroll"><table class="cal"><thead><tr><th class="who-c"></th>';
  for(const d of days){
    const k=toKey(d);
    h+='<th class="'+(k===tk?'today':'')+'">'+dayName(d)[0]+'<span class="d">'+d.getDate()+'</span></th>';
  }
  h+='</tr></thead><tbody>';
  for(const c of st.coaches){
    h+='<tr><td class="who-c">'+esc(c.name)+'</td>';
    for(const d of days){
      const k=toKey(d),v=cell(c.id,k),w=d.getDay()===0||d.getDay()===6;
      h+='<td class="'+(v?(v.m==="F"?'f':'s'):(w?'we':''))+'"'+(v?' title="'+esc(v.t)+'"':'')+'>'+(v?v.m:'')+'</td>';
    }
    h+='</tr>';
  }
  return h+'</tbody></table></div></section>';
}

function vTeam(){
  let h='<section class="card pad" style="margin-bottom:16px"><div class="sec-h"><h2 class="h2">Team</h2><span class="muted">'+st.coaches.length+' coaches</span></div>'
    +'<div class="form"><label class="field"><span class="lbl">Coach name</span>'
    +'<input class="input" placeholder="e.g. Sam de Vries" value="'+esc(st.addName)+'" oninput="_cfh.addName(this.value)" onkeydown="if(event.key===\'Enter\')_cfh.addCoach()"></label>'
    +'<button class="btn btn-primary" onclick="_cfh.addCoach()">'+ic('plus')+'Add coach</button></div>'
    +'<p class="muted" style="margin:12px 0 0">Each coach fills in their own weekly classes. Holidays use this schedule to work out what needs cover.</p></section>';
  if(!st.coaches.length)return h;
  h+='<div class="coaches">';
  for(const c of st.coaches){
    const tot=DAYS.reduce((n,d)=>n+c.schedule[d].length,0);
    h+='<section class="card" style="overflow:hidden"><div class="coach-h"><div class="who"><span class="avatar">'+esc(initials(c.name))+'</span>'
      +'<div style="min-width:0"><h3 class="h2 nm">'+esc(c.name)+'</h3><div class="sub">'+tot+' classes a week</div></div></div>'
      +'<button class="iconbtn danger" aria-label="Remove '+esc(c.name)+'" title="Remove coach" onclick="_cfh.rmCoach(\''+c.id+'\')">'+ic('trash')+'</button></div>'
      +'<div class="week">';
    for(const d of DAYS){
      h+='<div class="day"><span class="lbl">'+d+'</span>';
      c.schedule[d].forEach((cl,i)=>{
        h+=chip(cl.time,cl.type,cl.loc,'<button class="x" aria-label="Remove class" onclick="_cfh.rmClass(\''+c.id+'\',\''+d+'\','+i+')">'+ic('x')+'</button>');
      });
      if(st.editingDay===c.id+"|"+d){
        h+='<div class="addform">'
          +'<select class="select" aria-label="Time" onchange="_cfh.setTime(this.value)">'+TIMES.map(t=>'<option'+(t===st.editTime?' selected':'')+'>'+t+'</option>').join("")+'</select>'
          +'<select class="select" aria-label="Class type" onchange="_cfh.setType(this.value)">'+allTypes().map(t=>'<option'+(t.name===st.editType?' selected':'')+'>'+esc(t.name)+'</option>').join("")+'</select>'
          +'<select class="select" aria-label="Location" onchange="_cfh.setLoc(this.value)">'+LOCS.map(t=>'<option'+(t===st.editLoc?' selected':'')+'>'+t+'</option>').join("")+'</select>'
          +'<div class="row"><button class="btn btn-primary btn-sm" onclick="_cfh.addClass(\''+c.id+'\',\''+d+'\')">Add</button>'
          +'<button class="btn btn-ghost btn-sm" onclick="_cfh.closeAdd()">Cancel</button></div></div>';
      }else{
        h+='<button class="add-cls" onclick="_cfh.openAdd(\''+c.id+'\',\''+d+'\')">'+ic('plus')+'Class</button>';
      }
      h+='</div>';
    }
    h+='</div></section>';
  }
  return h+'</div>';
}

function vSettings(){
  let h='<section class="card pad"><div class="sec-h"><h2 class="h2">Class types</h2></div>'
    +'<p class="muted" style="margin:-8px 0 20px">New types show up straight away in every coach\'s class picker. Add a duration if the class is not the usual length; it appears on the chip.</p>'
    +'<div class="form">'
    +'<label class="field"><span class="lbl">Name</span><input class="input" placeholder="e.g. Mobility" value="'+esc(st.ntName)+'" oninput="_cfh.ntName(this.value)" onkeydown="if(event.key===\'Enter\')_cfh.addType()"></label>'
    +'<label class="field" style="flex:0 0 auto"><span class="lbl">Colour</span><input class="input" type="color" value="'+esc(st.ntColor)+'" onchange="_cfh.ntColor(this.value)"></label>'
    +'<label class="field" style="flex:0 1 140px"><span class="lbl">Minutes</span><input class="input" type="number" min="5" step="5" placeholder="Optional" value="'+esc(st.ntDur)+'" oninput="_cfh.ntDur(this.value)"></label>'
    +'<button class="btn btn-primary" onclick="_cfh.addType()">'+ic('plus')+'Add type</button></div>'
    +'<div class="divider"></div>'
    +'<div class="lbl" style="margin-bottom:12px">Built-in</div><div class="chips">'+BUILTIN.map(t=>typeChip(t)).join("")+'</div>'
    +'<div class="lbl" style="margin:24px 0 12px">Added by you</div>';
  const cts=st.customTypes||[];
  if(!cts.length)h+='<p class="muted" style="margin:0">None yet.</p>';
  else h+='<div class="chips">'+cts.map(t=>typeChip(t,'<button class="x" aria-label="Remove '+esc(t.name)+'" data-n="'+esc(t.name)+'" onclick="_cfh.rmType(this.dataset.n)">'+ic('x')+'</button>')).join("")+'</div>';
  return h+'</section>';
}

function render(){
  const tabs=[["plan","Plan"],["calendar","Calendar"],["team","Team &amp; hours"],["settings","Settings"]];
  const stat=store.mode==="cloud"?['','Live','Shared board: everyone with the link sees the same data. Press Refresh to load changes from others.']
    :store.mode==="shared"?['shared','Shared','Shared with the whole team.']
    :store.mode==="local"?['warn','This device only','Saved in this browser only. Other coaches will not see it.']
    :['bad','Not saved','No storage available: data is lost when you close or refresh.'];
  let h='<header class="top"><div class="brand">'+LOGO+'<div><h1>Holiday Board</h1><p>CrossFit Hofplein coaching team</p></div></div>'
    +'<div class="top-r"><span class="status '+stat[0]+'" title="'+esc(stat[2])+'"><i></i><span>'+stat[1]+'</span></span>'
    +'<button class="btn btn-ghost btn-sm" onclick="_cfh.refresh()" aria-label="Refresh">'+ic('refresh')+'<span>'+(st.loading?'Loading':'Refresh')+'</span></button></div></header>'
    +'<nav class="tabs" role="tablist">'+tabs.map(([k,l])=>'<button class="tab'+(st.tab===k?' on':'')+'" role="tab" aria-selected="'+(st.tab===k)+'" onclick="_cfh.tab(\''+k+'\')">'+l+'</button>').join("")+'</nav>'
    +'<main>';
  if(st.loading)h+='<div class="stats"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="sk" style="height:260px"></div>';
  else h+=st.tab==="team"?vTeam():st.tab==="plan"?vPlan():st.tab==="settings"?vSettings():vCal();
  document.getElementById("app").innerHTML=h+'</main>';
}

render();
loadAll();

})();
</script>
</body>
</html>
